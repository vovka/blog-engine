name: Verify Giscus Branch

on:
  push:
    branches:
      - feat/giscus-comments
    paths:
      - .github/workflows/verify-giscus-branch.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/giscus-comments
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependency
        run: npm install --save-exact @giscus/react@3.1.0
      - name: Create temporary consumer configuration
        run: |
          mkdir -p content
          cat > blog.config.js <<'EOF'
          export default {
            siteName: 'Test Blog',
            title: 'Test Blog',
            description: 'Build verification',
            author: 'Test Author',
            basePath: '/',
            comments: {
              provider: 'giscus',
              repo: 'vovka/blog-comments',
              repoId: '',
              category: 'Article comments',
              categoryId: '',
              canonicalBaseUrl: 'https://blog.shcherbyna.me'
            }
          };
          EOF
          echo "export const posts = []; export const getPostBySlug = () => undefined; export const getPostsByCategory = () => []; export const getAllCategories = () => []; export const getAllTags = () => []; export const getPostsByTag = () => [];" > content/posts.js
          echo "export const pages = []; export const getPageBySlug = () => undefined;" > content/pages.js
          echo "export const pages = [];" > content/metadata.js
      - name: Build engine consumer
        run: npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Update lockfile for giscus dependency"
          git push
