name: Synchronize fallback mirror

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check mirror credential
        id: credential
        env:
          GH_TOKEN: ${{ secrets.GEEK_BLOG_MIRROR_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mirror credential is unavailable; skipping synchronization."
          fi
      - name: Configure authenticated Git transport
        if: steps.credential.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GEEK_BLOG_MIRROR_TOKEN }}
        run: gh auth setup-git
      - name: Merge canonical history into fallback
        if: steps.credential.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GEEK_BLOG_MIRROR_TOKEN }}
        run: |
          git remote add mirror https://github.com/vovka/blog-engine.git
          git fetch mirror main --tags
          git config user.name "geek-blog mirror"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B mirror-main mirror/main
          git merge --no-edit "$GITHUB_SHA"
          git push mirror mirror-main:main
          git push mirror --tags
      - name: Verify fallback source tree
        run: |
          git remote get-url mirror >/dev/null 2>&1 ||
            git remote add mirror https://github.com/vovka/blog-engine.git
          git fetch mirror main
          test "$(git rev-parse "$GITHUB_SHA^{tree}")" = \
            "$(git rev-parse 'mirror/main^{tree}')"
